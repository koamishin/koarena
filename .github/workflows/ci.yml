name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/koarena
  DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/koarena
  REDIS_URL: redis://localhost:6379
  # A throwaway key for the test suite: the flags the tests create are never
  # read outside the database.
  FLAG_ENCRYPTION_KEY: CQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQk=
  # The judging tests must not reach for a sandbox.
  RUNNER_MODE: simulated

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: koarena
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d koarena"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.7

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations
        run: pnpm db:deploy

      - name: Lint and format
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # The Clerk provider is imported at build time; a placeholder key is
          # enough for the bundle — the app never calls Clerk during the build.
          CLERK_SECRET_KEY: sk_test_ci_placeholder
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Validate the compose file
        run: docker compose -f infra/docker-compose.yml config --quiet
