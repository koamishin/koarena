name: koarena

services:
  postgres:
    image: postgres:17-alpine
    container_name: koarena-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-koarena}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-koarena}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: koarena-redis
    restart: unless-stopped
    # BullMQ needs a classic Redis with blocking commands. Keep persistence on:
    # a queued judging job must survive a restart.
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # Object storage for challenge attachments and hackathon archives.
  # Optional in local dev:  docker compose --profile storage up -d
  # Production points at S3 or R2 instead (see .env.example).
  minio:
    image: alpine/minio:latest
    container_name: koarena-minio
    profiles: ['storage']
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-koarena}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-koarena-secret}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
  minio-data:
